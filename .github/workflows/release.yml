name: release

# Push a tag such as v1.0.0 to build the Windows binaries and publish a
# GitHub Release, then publish the binaries to the Cloudflare Pages download
# site (pages.yml). The phone app's download page links to releases/latest.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/bluehandle/frontend/package-lock.json
      - run: go vet ./...
      - run: go test ./...
      - name: Build frontend
        working-directory: cmd/bluehandle/frontend
        run: |
          npm ci
          npm run build
      - name: Build binaries
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          go build -tags production -trimpath -ldflags "-s -w -H windowsgui -X main.version=${version}" -o dist/bluehandle.exe ./cmd/bluehandle
          go build -trimpath -ldflags "-s -w" -o dist/bluehandle-cli.exe ./cmd/bluehandle-cli
      # Unsigned MSIX for Microsoft Store submission; the Store signs it.
      # Identity comes from Partner Center > Product identity, stored as
      # repository variables.
      - name: Pack MSIX
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          ./cmd/bluehandle/build/msix/pack.ps1 -Version $version -Exe dist/bluehandle.exe -Out "dist/bluehandle-$version-x64.msix"
      - uses: actions/upload-artifact@v4
        with:
          name: bluehandle-msix
          path: dist/*.msix
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/bluehandle.exe dist/bluehandle-cli.exe dist/*.msix \
            --title "蓝色手柄电脑端 $GITHUB_REF_NAME" --generate-notes

  # Refresh the Cloudflare Pages download site with the new binaries.
  pages:
    needs: release
    uses: ./.github/workflows/pages.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
