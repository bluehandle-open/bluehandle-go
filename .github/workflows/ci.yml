name: ci

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Wails v3 needs Go 1.26; the version lives in go.mod only.
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/bluehandle-cli

  # The desktop app is Windows-only: pure Go plus the embedded frontend.
  gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/bluehandle/frontend/package-lock.json
      - name: Build frontend
        working-directory: cmd/bluehandle/frontend
        run: |
          npm ci
          npm run build
      - name: Build bluehandle.exe
        shell: bash
        run: go build -tags production -trimpath -ldflags "-s -w -H windowsgui -X main.version=${GITHUB_SHA::7}" -o bin/bluehandle.exe ./cmd/bluehandle
      - uses: actions/upload-artifact@v4
        with:
          name: bluehandle-windows
          path: bin/bluehandle.exe
